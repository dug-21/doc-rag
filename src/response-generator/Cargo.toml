[package]
name = "response-generator"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "High-accuracy response generation system with citation tracking and multi-stage validation"
license.workspace = true
repository.workspace = true

[dependencies]
# Async runtime and utilities
tokio = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }

# Serialization and data handling
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
uuid = { workspace = true }

# Error handling and validation
thiserror = { workspace = true }
anyhow = { workspace = true }
validator = { workspace = true }

# Text processing and markdown
pulldown-cmark = { version = "0.9", features = ["serde"] }
regex = { workspace = true }
unicode-segmentation = { workspace = true }

# Logging and metrics
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true, optional = true }

# Configuration
config = { workspace = true }
once_cell = { workspace = true }

# Hashing and utilities
blake3 = "1.5"
chrono = { workspace = true }
md5 = "0.7"
sha2 = { workspace = true }

# HTTP client for external validations
reqwest = { workspace = true }

# Performance monitoring
dashmap = { workspace = true }

# FACT caching integration
fact = { workspace = true } # Mandatory per Phase 2 requirements - RESTORED

# CLI support
clap = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Testing framework
tokio-test = { workspace = true }
criterion = { workspace = true }
proptest = { workspace = true }
mockall = { workspace = true }

# Test data generation
fake = { version = "2.9", features = ["derive", "chrono"] }
quickcheck = "1.0"
quickcheck_macros = "1.0"

# TOML support for configuration
toml = { workspace = true }
rand = { workspace = true }

[features]
default = ["validation", "streaming", "metrics", "fact-integration"]
validation = []
streaming = []
metrics = ["metrics-exporter-prometheus"]
fact-integration = [] # FACT removed

[[bin]]
name = "response-generator"
path = "src/main.rs"

[[bench]]
name = "response_generation"
harness = false

# Profile configuration moved to workspace root