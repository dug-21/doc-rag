[package]
name = "embedder"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "High-performance embedding generator for RAG system"

[dependencies]
# Core ML libraries
ruv-fann = { workspace = true, optional = true }
ndarray = "0.15"

# Async runtime and utilities
tokio = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }

# Serialization and data handling
serde = { workspace = true }
serde_json = { workspace = true }
bincode = "1.3"

# Error handling and logging
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }
rayon = "1.8"
dashmap = { workspace = true }
once_cell = { workspace = true }

# Text processing utilities
hashbrown = "0.14"

# File operations
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1.5"

# Path utilities
path-slash = "0.2"

# Math utilities
num-traits = "0.2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.8"
pretty_assertions = "1.4"
proptest = "1.4"
approx = "0.5.1"

[[bench]]
name = "embedding_benchmarks"
harness = false

[[bench]]
name = "similarity_benchmarks"
harness = false

[[example]]
name = "embedder_usage"
path = "examples/embedder_usage.rs"

[[example]]
name = "batch_processing"
path = "examples/batch_processing.rs"

[[example]]
name = "model_comparison"
path = "examples/model_comparison.rs"

[features]
default = ["validation", "neural"]
validation = []
neural = ["ruv-fann"]
