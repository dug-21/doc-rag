# Docker-specific configuration for neurosymbolic RAG system
[server]
host = "0.0.0.0"
port = 8080
metrics_port = 9090

[environment]
name = "docker"
log_level = "info"
enable_metrics = true
enable_cors = true

[database]
# Neo4j configuration
neo4j_uri = "bolt://neo4j:7687"
neo4j_user = "neo4j"
neo4j_password = "password"

# MongoDB configuration
mongodb_uri = "mongodb://mongodb:27017/neurosymbolic-rag"

# Redis configuration
redis_url = "redis://redis:6379"

# Qdrant configuration
qdrant_url = "http://qdrant:6333"

# Connection settings
db_connection_timeout_secs = 60
db_connection_pool_size = 5
db_connection_retry_attempts = 5
db_connection_retry_delay_ms = 2000

[neural]
chunker_enabled = true
model_path = "/app/models"

[symbolic]
reasoning_enabled = true
max_inference_depth = 5

[cache]
fact_cache_ttl = 3600
query_cache_ttl = 1800

[logging]
level = "info"
format = "json"

[health_checks]
interval_secs = 10
timeout_secs = 5

[pipeline]
timeout_secs = 120
max_concurrent_requests = 50
request_queue_size = 500

[circuit_breaker]
enabled = true
failure_threshold = 5
timeout_ms = 60000
half_open_max_calls = 3

[retry]
max_attempts = 5
base_delay_ms = 500
max_delay_ms = 10000

[feature_flags]
neural_chunker_enabled = true
symbolic_reasoning_enabled = true
fact_cache_enabled = true